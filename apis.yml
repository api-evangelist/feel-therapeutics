aid: feel-therapeutics
name: Feel Therapeutics
description: >-
  Feel Therapeutics, an IQVIA business, is a Digital Precision Medicine company
  on a mission to reinvent how mental health is diagnosed, managed and cared for
  by bringing objective data, continuous passive measurement and novel digital
  biomarkers into mental healthcare. Rather than relying on episodic, subjective
  self-reported questionnaires, Feel develops digital biomarkers from wearable
  and passive sensor data to enable continuous, objective monitoring. Its
  solutions span the Feel Digital Precision Medicine Platform (DPMP), Feel DTx
  precision digital therapeutics, drug-plus / beyond-the-pill programs, and a
  wearable monitoring device. The company partners with pharma and biotech to
  advance clinical development, real-world evidence (RWE), and commercialization
  strategies, and has run 20+ research studies with 3000+ participants.
